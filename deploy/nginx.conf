# Replace domain, document root, and certificate paths before installing.
# Copy dist contents to /srv/epaper-frame/site. This is a static-only site.
server {
    listen 80;
    server_name frame.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name frame.example.com;
    ssl_certificate /etc/letsencrypt/live/frame.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/frame.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/epaper-frame/site;
    index index.html;
    include /etc/nginx/mime.types;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "bluetooth=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'" always;
    add_header Cache-Control "no-cache" always;
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
}
