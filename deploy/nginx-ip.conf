# Current self-hosted IP deployment. Existing service retains TCP 443.
server {
    listen 80;
    server_name 103.117.138.156;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/epaper-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://103.117.138.156:8443$request_uri; }
}
server {
    listen 8443 ssl default_server;
    server_name 103.117.138.156;
    ssl_certificate /etc/letsencrypt/live/epaper-frame-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/epaper-frame-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/epaper-frame/site;
    index index.html;
    include /etc/nginx/mime.types;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "bluetooth=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'" always;
    add_header Cache-Control "no-cache" always;
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
}
